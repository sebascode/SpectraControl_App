name: Audit

on:
  push:
    branches: [master]
    paths:
      - "backend/go.sum"
      - "backend/go.mod"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/go.sum"
      - "backend/go.mod"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # Weekly Monday 07:00 UTC — surfaces new advisories without needing a push.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (src-tauri)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of pinning

      - name: Cache cargo-audit binary
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  govulncheck:
    name: govulncheck (backend)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: backend
        run: |
          govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          # Reachable findings only (a trace that starts at a function), minus
          # the IDs we accepted on purpose in .github/govulncheck-ignore.txt.
          jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' \
            "$RUNNER_TEMP/govulncheck.json" | sort -u > "$RUNNER_TEMP/found.txt"
          grep -vE '^\s*(#|$)' ../.github/govulncheck-ignore.txt | sort -u > "$RUNNER_TEMP/ignored.txt" || true
          new=$(comm -23 "$RUNNER_TEMP/found.txt" "$RUNNER_TEMP/ignored.txt")
          if [ -n "$new" ]; then
            echo "Unaccepted vulnerabilities:"; echo "$new"
            govulncheck ./... || true
            exit 1
          fi
          echo "No unaccepted vulnerabilities (ignored: $(paste -sd, "$RUNNER_TEMP/ignored.txt"))"
